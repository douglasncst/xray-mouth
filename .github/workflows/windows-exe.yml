name: Build Windows portable EXE

on:
  push:
    branches:
      - build/windows-portable-exe-20261003
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build portable EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name xray-mouth --paths src --collect-all PIL --collect-all pydicom xray_mouth_launcher.py

      - name: Smoke test executable
        shell: pwsh
        run: |
          .\dist\xray-mouth.exe --version

      - name: Generate checksum
        shell: pwsh
        run: |
          (Get-FileHash .\dist\xray-mouth.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii .\dist\xray-mouth.exe.sha256

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: xray-mouth-windows-portable-v0.1.0
          path: |
            dist/xray-mouth.exe
            dist/xray-mouth.exe.sha256
          if-no-files-found: error
          retention-days: 30
