name: Feature request
description: Propose an improvement to a research or maintenance workflow.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reproducibility, privacy, or maintenance problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Responsible use
      options:
        - label: This request does not require sharing patient data or making clinical claims.
          required: true
