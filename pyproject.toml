[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xray-mouth"
version = "0.2.0.dev0"
description = "Privacy-first inspection, DICOM de-identification, and non-diagnostic dental radiograph organization."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Douglas Casty" }]
keywords = ["dental", "dicom", "medical-imaging", "x-ray", "privacy"]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Medical Science Apps."]
dependencies = ["Pillow>=10.0", "pydicom>=3.0", "reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8", "build>=1.2", "twine>=5.1"]

[project.scripts]
xray-mouth = "xray_mouth.cli:main"

[project.urls]
Homepage = "https://github.com/douglasncst/xray-mouth"
Issues = "https://github.com/douglasncst/xray-mouth/issues"
Changelog = "https://github.com/douglasncst/xray-mouth/blob/main/CHANGELOG.md"
Documentation = "https://github.com/douglasncst/xray-mouth/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/xray_mouth"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=xray_mouth --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
