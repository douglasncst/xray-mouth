[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xray-mouth"
version = "0.2.0"
description = "Local Green Smile periapical-series PDF report generator."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Douglas Casty" }]
keywords = ["dental", "dicom", "medical-imaging", "x-ray", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "Pillow>=10.0",
  "playwright==1.63.0",
  "pydicom>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "build>=1.2",
  "pypdf>=5.0",
]

[project.scripts]
xray-mouth = "xray_mouth.cli:main"

[project.urls]
Homepage = "https://github.com/douglasncst/xray-mouth"
Issues = "https://github.com/douglasncst/xray-mouth/issues"
Changelog = "https://github.com/douglasncst/xray-mouth/blob/main/CHANGELOG.md"
Documentation = "https://github.com/douglasncst/xray-mouth/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/xray_mouth"]

[tool.hatch.build.targets.wheel.force-include]
"assets/green_smile_reference_header.png" = "xray_mouth/assets/green_smile_reference_header.png"

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=xray_mouth --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
